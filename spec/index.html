<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIP-332 Specification</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #f7931a;
      --muted: #8b949e;
      --border: #30363d;
      --card-bg: #161b22;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    a { color: var(--accent); }
    h1, h2, h3 { margin-top: 2rem; margin-bottom: 1rem; }
    h1 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    h2 { color: var(--fg); }
    code {
      background: var(--card-bg);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    pre {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      text-align: left;
    }
    th { background: var(--card-bg); }
    blockquote {
      border-left: 3px solid var(--accent);
      margin: 1rem 0;
      padding-left: 1rem;
      color: var(--muted);
    }
    .nav { margin-bottom: 2rem; }
    .nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../">Home</a>
    <a href="nip-332.md">Raw Markdown</a>
    <a href="https://github.com/nip-332/nip-332.github.io/blob/gh-pages/spec/nip-332.md">Edit on GitHub</a>
  </nav>
  <div id="content">Loading...</div>
  <script>
    fetch('nip-332.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<p>Failed to load specification.</p>';
      });
  </script>
</body>
</html>
