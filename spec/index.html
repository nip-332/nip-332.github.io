<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIP-332 Specification</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; color: #2c2c2c; background: #fafaf8; line-height: 1.7; max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; }
    a { color: #1a5276; text-decoration: none; } a:hover { text-decoration: underline; }
    h1, h2, h3, h4 { font-weight: normal; margin-top: 2rem; margin-bottom: 0.75rem; }
    h1 { font-size: 2rem; letter-spacing: 0.02em; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem; }
    h2 { font-size: 1.35rem; border-bottom: 1px solid #e5e3dd; padding-bottom: 0.35rem; }
    h3 { font-size: 1.1rem; } h4 { font-size: 1rem; font-style: italic; }
    p { margin-bottom: 0.9rem; } ul, ol { margin: 0 0 0.9rem 1.4rem; } li { margin-bottom: 0.3rem; }
    code, pre { font-family: 'Courier New', Courier, monospace; background: #f0efeb; border-radius: 3px; }
    code { padding: 0.1em 0.35em; font-size: 0.92em; }
    pre { padding: 1rem; overflow-x: auto; font-size: 0.85rem; line-height: 1.5; margin-bottom: 0.9rem; border: 1px solid #e5e3dd; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid #e5e3dd; vertical-align: top; }
    th { color: #666; font-weight: normal; font-style: italic; }
    blockquote { border-left: 3px solid #c9c6bd; margin: 1rem 0; padding-left: 1rem; color: #666; }
    .nav { margin-bottom: 2rem; font-size: 0.95rem; } .nav a { margin-right: 1.25rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../">Home</a>
    <a href="nip-332.md">Raw Markdown</a>
    <a href="https://github.com/nip-332/nip-332.github.io/blob/gh-pages/spec/nip-332.md">Edit on GitHub</a>
  </nav>
  <div id="content">Loading...</div>
  <script>
    fetch('nip-332.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<p>Failed to load specification.</p>';
      });
  </script>
</body>
</html>
