  <text x="90" y="300" font-family="DejaVu Serif, serif" font-size="78" fill="#2c2c2c">Who verified</text>
  <text x="90" y="388" font-family="DejaVu Serif, serif" font-size="78" fill="#2c2c2c">this snapshot?</text>
  <text x="90" y="458" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#666">assumeUTXO attestations over Nostr: a node says, under its own key,</text>
  <text x="90" y="496" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#666">what it computed. Kind 3332, signed, permanent, weighed not counted.</text>
